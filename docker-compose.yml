version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: monitor-postgres
    environment:
      POSTGRES_DB: servermonitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
